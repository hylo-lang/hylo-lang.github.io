name: CI

on:
  push:
  # Pull requests from forks, which push no branch here. Those from this repository's branches
  # are already checked by their pushes, so each job skips them.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    if: &not-a-pull-request-from-here github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build site
    if: *not-a-pull-request-from-here
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record the release to build against
        run: node scripts/write-release-tag.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm run build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  typos:
    name: Spell check (typos)
    if: *not-a-pull-request-from-here
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run typos
        uses: crate-ci/typos@v1.51.1

  links:
    name: Link check (lychee)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Restore lychee cache
        uses: actions/cache@v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 3
            --accept '200..=299,429'
            --root-dir ${{ github.workspace }}/dist
            './dist/**/*.html'
